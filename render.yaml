# ==============================================================================
# RENDER.COM BLUEPRINT SPECIFICATION — RENOVA CIRCULAR PLATFORM
# ==============================================================================
# Bản thiết kế triển khai TOÀN BỘ RENOVA trên 1 WEB SERVICE DUY NHẤT:
#   - Tự động build giao diện Next.js (frontend/out)
#   - Chạy máy chủ FastAPI Python phục vụ đồng thời cả Website & API & AI Chatbot
#   - Không tốn tiền 2 dịch vụ, không cần tên miền riêng, không lo lỗi CORS
#
# Cách sử dụng trên Render:
#   1. Đăng nhập https://dashboard.render.com
#   2. Nhấn "New +" -> Chọn "Blueprint"
#   3. Kết nối với Repository GitHub này -> Chọn nhánh 'client-release'
#   4. Nhập mã DEEPSEEK_API_KEY -> Nhấn Apply là xong!
# ==============================================================================

services:
  - type: web
    name: renova
    runtime: python
    region: singapore # Khu vực gần Việt Nam nhất, tốc độ phản hồi nhanh
    plan: starter
    # Render tự động cài Node để build Next.js tĩnh, sau đó cài thư viện Python
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt
    startCommand: cd backend && python ingest.py && uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Ổ đĩa lưu trữ ChromaDB vector AI không bị mất khi restart/redeploy
    disk:
      name: renova-chroma-storage
      mountPath: /opt/render/project/src/ai/chroma_db
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.14.0
      # Khóa API DeepSeek (Render sẽ hiển thị ô để bạn nhập key trên giao diện)
      - key: DEEPSEEK_API_KEY
        sync: false
